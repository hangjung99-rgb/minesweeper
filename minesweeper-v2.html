<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지뢰찾기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f3;--text:#1a1a1a;--text2:#666;--text3:#aaa;--border:#e0e0e0;--border2:#ccc;--r:8px;--rlg:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#252525;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:#333;--border2:#444;}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg2);color:var(--text);min-height:100vh;}

/* 화면 전환 */
.page{display:none;width:100%;min-height:100vh;}
.page.on{display:flex;flex-direction:column;}

/* 로비 */
#pg-lobby{align-items:center;justify-content:center;padding:2rem 1rem;}
.lobby-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px;}

/* 대기 */
#pg-waiting{align-items:center;justify-content:center;padding:2rem;}
.wait-box{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:#185FA5;border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 게임 */
#pg-game{align-items:center;padding:1rem;gap:12px;}
.game-inner{width:100%;max-width:900px;display:flex;flex-direction:column;gap:12px;}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);font-size:12px;}
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.player-card{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;}
.player-card.me{border:2px solid #185FA5;}
.player-card.other{border:0.5px solid var(--border);}
#board-wrap{overflow-x:auto;width:100%;}
#board{display:grid;grid-template-columns:repeat(20,39px);gap:2px;margin:0 auto;}
.cell{width:39px;height:39px;border:0.5px solid var(--border2);border-radius:4px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;cursor:pointer;user-select:none;}
.cell:hover:not(.revealed):not(.flagged){background:var(--bg);border-color:#888;}
.cell.revealed{background:var(--bg);cursor:default;border-color:var(--border);}
.cell.flagged{background:#FAEEDA;border-color:#EF9F27;}
.cell.mine-hit{background:#FCEBEB;border-color:#E24B4A;}
.cell.mine-show{color:#E24B4A;}
.n1{color:#185FA5;}.n2{color:#3B6D11;}.n3{color:#A32D2D;}
.n4{color:#3C3489;}.n5{color:#993C1D;}.n6{color:#0F6E56;}
.n7{color:#72243E;}.n8{color:#888;}

/* 미션 / 승인 */
#pg-mission,#pg-approval{align-items:center;padding:1rem;gap:12px;}
.form-box{width:100%;max-width:500px;display:flex;flex-direction:column;gap:12px;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rlg);padding:1.25rem;display:flex;flex-direction:column;gap:10px;}
.card-title{font-size:15px;font-weight:500;}
.mission-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mbtn{padding:12px 8px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);cursor:pointer;text-align:center;transition:background .1s;-webkit-tap-highlight-color:transparent;}
.mbtn:hover{background:var(--bg);border-color:#888;}
.mbtn.sel{border:2px solid #185FA5;background:#E6F1FB;color:#0C447C;}
.time-row{display:flex;gap:10px;align-items:center;}
.btn-row{display:flex;gap:8px;}
.btn-back{flex:1;padding:12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;}
.btn-back:hover{background:var(--bg2);}
.btn-main{flex:2;padding:12px;border:none;border-radius:var(--r);background:var(--text);color:var(--bg);font-size:14px;font-weight:500;cursor:pointer;}
.btn-main:hover{opacity:.85;}
.btn-main:disabled{opacity:.4;cursor:not-allowed;}

/* 공통 */
input[type=text],input[type=password],select{width:100%;padding:10px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text);font-size:14px;outline:none;}
input:focus,select:focus{border-color:#555;}
.err{font-size:12px;color:#E24B4A;padding:7px 10px;background:#FCEBEB;border-radius:var(--r);display:none;}
.hint{font-size:12px;color:var(--text3);}
.badge-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.turn-num{font-size:28px;font-weight:500;text-align:center;}
.status-chip{font-size:11px;padding:2px 8px;border-radius:20px;text-align:center;}
.sc-ok{background:#EAF3DE;color:#27500A;}
.sc-wait{background:#FAEEDA;color:#633806;}
.sc-none{background:#f1f1ef;color:#888;}
.mission-btn-small{width:100%;padding:7px;font-size:12px;border:0.5px solid #185FA5;border-radius:8px;background:#E6F1FB;color:#0C447C;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.mission-btn-small:active{filter:brightness(.95);}
</style>
</head>
<body>

<!-- 로비 -->
<div id="pg-lobby" class="page on">
  <div class="lobby-box">
    <div style="font-size:44px;text-align:center;">💣</div>
    <div style="font-size:22px;font-weight:600;text-align:center;">지뢰찾기</div>
    <div style="font-size:13px;color:var(--text3);text-align:center;">관리자에게 받은 방 코드와 이름을 입력하세요</div>
    <div class="card">
      <input type="text" id="inp-rid" placeholder="방 코드 (6자리)"
        style="text-align:center;letter-spacing:6px;font-size:20px;font-weight:700;text-transform:uppercase;">
      <input type="text" id="inp-name" placeholder="내 이름" style="text-align:center;font-size:16px;">
      <div class="err" id="join-err"></div>
      <button class="btn-main" id="btn-join" style="flex:none;">입장하기 →</button>
    </div>
    <div style="text-align:center;font-size:12px;color:var(--text3);">관리자는 admin-panel.html 을 사용하세요</div>
  </div>
</div>

<!-- 입장 대기 -->
<div id="pg-waiting" class="page">
  <div class="wait-box">
    <div class="spinner"></div>
    <div style="font-size:20px;font-weight:600;"><span id="wait-name"></span>님</div>
    <div style="font-size:14px;color:var(--text2);line-height:1.8;">관리자 승인을 기다리는 중이에요<br>승인되면 자동으로 게임에 입장돼요</div>
    <div style="font-size:12px;color:var(--text3);">이 탭을 열어두세요</div>
  </div>
</div>

<!-- 게임 -->
<div id="pg-game" class="page">
  <div class="game-inner">
    <div class="status-bar">
      <div style="font-weight:500;display:flex;align-items:center;gap:5px;">💣 <span id="mines-left">0</span></div>
      <div id="game-msg" style="font-size:12px;flex:1;text-align:center;padding:0 8px;color:#185FA5;"></div>
    </div>
    <div class="players-grid" id="players-grid"></div>
    <div id="board-wrap"><div id="board"></div></div>
  </div>
</div>

<!-- 미션 선택 -->
<div id="pg-mission" class="page">
  <div class="form-box">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px;">
        <div id="m-badge"></div>
        <div class="card-title" id="m-title">미션 선택</div>
      </div>
      <div class="mission-grid" id="mission-grid"></div>
      <div class="err" id="mission-err"></div>
    </div>
    <div class="card">
      <div class="card-title">수행 시간</div>
      <div class="hint" id="time-hint">미션을 먼저 선택하세요</div>
      <div class="time-row">
        <select id="inp-h" style="width:130px;"><option value="0">0시간</option></select>
        <span style="color:var(--text2);">+</span>
        <select id="inp-m" style="width:110px;">
          <option value="0">0분</option>
          <option value="30">30분</option>
        </select>
      </div>
      <div class="err" id="time-err"></div>
    </div>
    <div class="btn-row">
      <button class="btn-back" id="btn-back-mission">← 게임으로</button>
      <button class="btn-main" id="btn-submit-mission">승인 요청 →</button>
    </div>
  </div>
</div>

<!-- 승인 대기 -->
<div id="pg-approval" class="page">
  <div class="form-box">
    <div class="card">
      <div class="card-title">⏳ 관리자 승인 대기 중</div>
      <div id="approval-desc" style="font-size:13px;color:var(--text2);line-height:1.7;"></div>
      <div style="background:var(--bg2);border-radius:var(--r);padding:12px;font-size:13px;color:var(--text3);text-align:center;line-height:1.7;">
        관리자 패널에서 승인하면<br>자동으로 게임 화면으로 이동해요<br>
        <span style="font-size:12px;">이 탭을 열어두세요</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-back" id="btn-back-game">← 게임으로</button>
      <button class="btn-main" id="btn-add-mission">+ 다른 미션 추가</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, onValue, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNiGqAegBSED4h-IJjzj9EkTR814Hlf2M",
  authDomain: "snailbumbroom-13b73.firebaseapp.com",
  databaseURL: "https://snailbumbroom-13b73-default-rtdb.firebaseio.com",
  projectId: "snailbumbroom-13b73",
  storageBucket: "snailbumbroom-13b73.firebasestorage.app",
  messagingSenderId: "983942434316",
  appId: "1:983942434316:web:948e08906badf01f2ca829"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const ROWS=20, COLS=20;
const MISSIONS=[
  {id:1,name:"흘듣",maxH:2},
  {id:2,name:"집듣",maxH:null},
  {id:3,name:"영어책",maxH:null},
  {id:4,name:"수학",maxH:null},
  {id:5,name:"한글책",maxH:null},
  {id:6,name:"음미체",maxH:2}
];
const COLORS=[
  {bg:"#B5D4F4",fg:"#0C447C"},{bg:"#C0DD97",fg:"#27500A"},
  {bg:"#FAC775",fg:"#633806"},{bg:"#F4C0D1",fg:"#72243E"},
  {bg:"#CECBF6",fg:"#3C3489"},{bg:"#9FE1CB",fg:"#085041"},
  {bg:"#F5C4B3",fg:"#712B13"},{bg:"#D3D1C7",fg:"#2C2C2A"},
  {bg:"#85B7EB",fg:"#042C53"},{bg:"#97C459",fg:"#173404"},
  {bg:"#ED93B1",fg:"#4B1528"},{bg:"#EF9F27",fg:"#412402"},
  {bg:"#5DCAA5",fg:"#04342C"},{bg:"#F09595",fg:"#501313"},
  {bg:"#7F77DD",fg:"#26215C"}
];

function calcTurns(secs){ return Math.floor(secs/1800); }
function fmtTime(secs){
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60);
  return h>0&&m>0?`${h}시간 30분`:h>0?`${h}시간`:"30분";
}

let ROOM_ID=null, myName="", gameState=null;
let selMissionId=null, missionPlayerIdx=null;
let approvalPlayerIdx=null, approvalMission="", approvalSecs=0;

const $=id=>document.getElementById(id);
function showErr(id,msg){$(id).textContent=msg;$(id).style.display="block";}
function hideErr(id){$(id).style.display="none";}
function setMsg(m){$("game-msg").textContent=m;}
function goPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
  $(id).classList.add("on");
}
function roomRef(p=""){ return ref(db,`rooms/${ROOM_ID}${p?"/"+p:""}`); }
async function sync(){ const s=await get(roomRef()); if(s.exists()) gameState=s.val(); }

function badgeEl(name,ci){
  const c=COLORS[ci%COLORS.length];
  const d=document.createElement("div");
  d.className="badge-av";
  d.style.cssText=`background:${c.bg};color:${c.fg};width:30px;height:30px;`;
  d.textContent=name[0].toUpperCase();
  return d;
}
function badgeHTML(name,ci){
  const c=COLORS[ci%COLORS.length];
  return `<div class="badge-av" style="background:${c.bg};color:${c.fg};">${name[0].toUpperCase()}</div>`;
}

// ── 입장 ──
$("btn-join").addEventListener("click", async()=>{
  const rid=$("inp-rid").value.trim().toUpperCase();
  const name=$("inp-name").value.trim();
  if(!rid||!name){showErr("join-err","방 코드와 이름을 입력하세요.");return;}
  $("btn-join").textContent="확인 중...";
  $("btn-join").disabled=true;
  ROOM_ID=rid;
  try{
    const snap=await get(roomRef());
    if(!snap.exists()){showErr("join-err","존재하지 않는 방입니다."); reset(); return;}
    const gs=snap.val();
    const player=gs.players.find(p=>p.name===name);
    if(!player){showErr("join-err","관리자가 등록한 이름이 아닙니다."); reset(); return;}
    myName=name; gameState=gs;
    await update(ref(db,`rooms/${ROOM_ID}/pendingJoin`),{
      [name]:{name,requestedAt:Date.now(),approved:false,rejected:false}
    });
    $("wait-name").textContent=name;
    goPage("pg-waiting");
    listenState();
  }catch(e){showErr("join-err","오류: "+e.message); reset();}
  function reset(){$("btn-join").textContent="입장하기 →";$("btn-join").disabled=false;}
});
$("inp-rid").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());
$("inp-rid").addEventListener("keydown",e=>{if(e.key==="Enter")$("inp-name").focus();});
$("inp-name").addEventListener("keydown",e=>{if(e.key==="Enter")$("btn-join").click();});

// ── 실시간 감지 ──
function listenState(){
  onValue(roomRef(), snap=>{
    if(!snap.exists()) return;
    const prev=gameState;
    gameState=snap.val();
    const cur=document.querySelector(".page.on");
    const curId=cur?cur.id:"";

    // 입장 대기 → 승인
    if(curId==="pg-waiting"){
      const pj=gameState.pendingJoin||{};
      const me=pj[myName];
      if(me&&me.approved){ goPage("pg-game"); renderGame(); return; }
      if(me&&me.rejected){ showErr("join-err","관리자가 입장을 거절했습니다."); goPage("pg-lobby"); return; }
    }

    // 게임 화면 실시간 업데이트
    if(curId==="pg-game") renderGame();

    // 미션 승인 실시간 감지 — 어느 화면에 있든 pending→false 되면 게임으로
    if(myName && curId!=="pg-lobby" && curId!=="pg-waiting"){
      const me=gameState.players.find(p=>p.name===myName);
      const prevMe=prev&&prev.players?prev.players.find(p=>p.name===myName):null;
      if(me&&prevMe&&prevMe.pending===true&&me.pending===false){
        goPage("pg-game");
        renderGame();
        setMsg("✅ 미션 승인! 현재 턴: "+me.turns+"회");
      }
    }
  });
}

// ── 지뢰판 ──
function genBoard(sr,sc,mines){
  const b=Array(ROWS*COLS).fill(0); let n=0;
  while(n<mines){
    const i=Math.floor(Math.random()*ROWS*COLS);
    const r=Math.floor(i/COLS),c=i%COLS;
    if(b[i]===-1||Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1) continue;
    b[i]=-1; n++;
  }
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    if(b[r*COLS+c]===-1) continue;
    let cnt=0;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      const nr=r+dr,nc=c+dc;
      if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&b[nr*COLS+nc]===-1) cnt++;
    }
    b[r*COLS+c]=cnt;
  }
  return b;
}
function flood(b,rev,r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS||rev[r*COLS+c]) return;
  rev[r*COLS+c]=true;
  if(b[r*COLS+c]===0) for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) flood(b,rev,r+dr,c+dc);
}
function checkWin(b,rev){ for(let i=0;i<ROWS*COLS;i++) if(!rev[i]&&b[i]!==-1) return false; return true; }

async function clickCell(r,c){
  await sync();
  const gs=gameState;
  if(gs.gameOver||gs.gameWon) return;
  const pi=gs.players.findIndex(p=>p.name===myName);
  if(pi===-1){setMsg("먼저 입장해야 해요."); return;}
  const me=gs.players[pi];
  if(me.turns<=0){setMsg("턴이 없어요! 미션을 입력하고 승인받으세요."); return;}
  const idx=r*COLS+c;
  if(gs.revealed[idx]||gs.flagged[idx]) return;
  const upd={};
  let board=gs.board;
  if(gs.firstClick){board=genBoard(r,c,gs.mines);upd.board=board;upd.firstClick=false;}
  if(board[idx]===-1){
    const nr=[...gs.revealed];nr[idx]=true;
    upd.revealed=nr;upd.gameOver=true;
    upd.msg=`💥 ${me.name}님이 지뢰를 밟았습니다! 게임 오버`;
  }else{
    const nr=[...gs.revealed];flood(board,nr,r,c);
    upd.revealed=nr;
    upd.players=gs.players.map((pl,i)=>i===pi?{...pl,turns:pl.turns-1}:pl);
    if(checkWin(board,nr)){upd.gameWon=true;upd.msg=`🎉 ${me.name}님이 마지막 칸을 열었습니다! 클리어!`;}
  }
  await update(roomRef(),upd);
}
async function toggleFlag(r,c){
  await sync();
  const gs=gameState;
  if(gs.gameOver||gs.gameWon) return;
  const idx=r*COLS+c;
  if(gs.revealed[idx]) return;
  const nf=[...gs.flagged];nf[idx]=!nf[idx];
  await update(roomRef(),{flagged:nf});
}

// ── 렌더 ──
function renderGame(){
  const gs=gameState; if(!gs) return;
  $("mines-left").textContent=gs.mines-(gs.flagged||[]).filter(Boolean).length;
  if(gs.msg) setMsg(gs.msg);
  renderPlayers(); renderBoard();
}

function renderPlayers(){
  const gs=gameState;
  const grid=$("players-grid");
  grid.innerHTML="";
  gs.players.forEach((p,i)=>{
    const isMe=p.name===myName;
    const hasTurn=p.turns>0;
    const card=document.createElement("div");
    card.className="player-card "+(isMe?"me":"other");
    card.style.background=isMe?"#f0f7ff":hasTurn?"#f8fff4":"var(--bg)";

    const chipCls=hasTurn?"sc-ok":p.pending?"sc-wait":"sc-none";
    const chipTxt=hasTurn?"턴 있음":p.pending?"승인 대기":"미션 필요";
    const lastLog=p.log&&p.log.length?p.log[p.log.length-1]:"";

    card.innerHTML=`
      <div style="display:flex;align-items:center;gap:8px;">
        ${badgeHTML(p.name,p.color)}
        <span style="font-size:13px;font-weight:500;">${p.name}${isMe?" <span style='font-size:11px;color:#185FA5;'>(나)</span>":""}</span>
      </div>
      <div class="turn-num">${p.turns}</div>
      <div style="font-size:11px;color:#888;text-align:center;">턴</div>
      <div class="status-chip ${chipCls}">${chipTxt}</div>
      ${isMe?`<button class="mission-btn-small" id="open-mission-btn">${p.pending?"+ 미션 추가":"미션 입력"}</button>`:""}
      ${isMe&&p.pending?`<div style="text-align:center;font-size:11px;color:#633806;padding:4px;">⏳ 승인 대기 중</div>`:""}
      <div style="font-size:10px;color:var(--text3);min-height:13px;">${lastLog}</div>`;

    if(isMe&&!p.pending){
      card.querySelector("#open-mission-btn").addEventListener("click",()=>openMission(i));
    }
    grid.appendChild(card);
  });
}

function renderBoard(){
  const gs=gameState;
  const bd=$("board"); bd.innerHTML="";
  const me=gs.players.find(p=>p.name===myName);
  const canPlay=me&&me.turns>0&&!gs.gameOver&&!gs.gameWon;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const idx=r*COLS+c;
    const el=document.createElement("div"); el.className="cell";
    if(gs.revealed&&gs.revealed[idx]){
      el.classList.add("revealed");
      const v=gs.board?gs.board[idx]:0;
      if(v===-1){el.classList.add("mine-hit");el.textContent="💣";}
      else if(v>0){el.textContent=v;el.classList.add("n"+v);}
    }else if(gs.flagged&&gs.flagged[idx]){
      el.classList.add("flagged");el.textContent="🚩";
    }else if((gs.gameOver||gs.gameWon)&&gs.board&&gs.board[idx]===-1){
      el.classList.add("mine-show");el.textContent="💣";
    }
    if(canPlay){
      el.addEventListener("click",()=>clickCell(r,c));
      el.addEventListener("contextmenu",e=>{e.preventDefault();toggleFlag(r,c);});
    }else if(!gs.gameOver&&!gs.gameWon){
      el.style.cursor="not-allowed";el.style.opacity="0.65";
    }
    bd.appendChild(el);
  }
}

// ── 미션 입력 ──
function openMission(playerIdx){
  missionPlayerIdx=playerIdx;
  selMissionId=null;
  const p=gameState.players[playerIdx];
  // 배지
  const bContainer=$("m-badge");
  bContainer.innerHTML="";
  bContainer.appendChild(badgeEl(p.name,p.color));
  $("m-title").textContent=p.name+"님 미션 입력";
  $("inp-h").innerHTML=`<option value="0">0시간</option>`;
  $("inp-m").value="0";
  $("time-hint").textContent="미션을 먼저 선택하세요";
  hideErr("mission-err"); hideErr("time-err");
  renderMissionGrid();
  goPage("pg-mission");
}

function renderMissionGrid(){
  const grid=$("mission-grid");
  grid.innerHTML="";
  MISSIONS.forEach(m=>{
    const div=document.createElement("div");
    div.className="mbtn"+(selMissionId===m.id?" sel":"");
    div.innerHTML=`<div style="font-size:14px;font-weight:500;">${m.name}</div>
      <div style="font-size:11px;color:${selMissionId===m.id?"#185FA5":"#aaa"};margin-top:3px;">${m.maxH?"최대 "+m.maxH+"시간":"무제한"}</div>`;
    div.addEventListener("click",()=>selectMission(m.id));
    grid.appendChild(div);
  });
}

function selectMission(mid){
  selMissionId=mid;
  const m=MISSIONS.find(x=>x.id===mid);
  const maxH=m.maxH||12;
  let opts="";
  for(let h=0;h<=maxH;h++) opts+=`<option value="${h}">${h}시간</option>`;
  $("inp-h").innerHTML=opts;
  $("inp-h").value="0";
  $("time-hint").textContent=m.maxH?"최대 "+m.maxH+"시간까지 입력 가능":"시간 제한 없음";
  hideErr("mission-err");
  renderMissionGrid();
}

$("btn-back-mission").addEventListener("click",()=>goPage("pg-game"));

$("btn-submit-mission").addEventListener("click", async()=>{
  if(!selMissionId){showErr("mission-err","미션을 선택하세요.");return;}
  const h=parseInt($("inp-h").value)||0;
  const m30=parseInt($("inp-m").value)||0;
  const secs=h*3600+m30*60;
  if(secs<=0){showErr("time-err","시간을 선택하세요.");return;}
  const m=MISSIONS.find(x=>x.id===selMissionId);
  if(m.maxH&&secs>m.maxH*3600){showErr("time-err",m.name+"은 최대 "+m.maxH+"시간까지만 인정됩니다.");return;}
  const turns=calcTurns(secs);
  const timeStr=fmtTime(secs);
  approvalPlayerIdx=missionPlayerIdx;
  approvalMission=m.name;
  approvalSecs=secs;
  // Firebase pending 기록 — 기존 대기 중인 시간에 누적
  const prevPlayer=gameState.players[missionPlayerIdx];
  const prevSecs=prevPlayer.pendingSecs||0;
  const totalSecs=prevSecs+secs;
  const totalTurns=calcTurns(totalSecs);
  const prevMission=prevPlayer.pendingMission||"";
  const missionNote=prevSecs>0
    ?`${prevMission} ${fmtTime(prevSecs)} + ${m.name} ${timeStr}`
    :`${m.name} ${timeStr}`;
  const newPlayers=gameState.players.map((pl,i)=>
    i===missionPlayerIdx?{...pl,pending:true,pendingMission:missionNote,pendingSecs:totalSecs}:pl
  );
  await update(roomRef(),{players:newPlayers});
  // 승인 화면
  const descExtra=prevSecs>0
    ?`<div style="margin-top:6px;font-size:12px;color:#888;text-align:center;">기존 대기: ${fmtTime(prevSecs)} + 추가: ${timeStr} = 합계 ${fmtTime(totalSecs)}</div>`
    :"";
  $("approval-desc").innerHTML=
    `<b>${gameState.players[missionPlayerIdx].name}</b>님이 <b>[${m.name}]</b> 미션을 <b>${timeStr}</b> 수행했습니다.`+
    descExtra+
    `<div style="margin-top:12px;background:#EAF3DE;border-radius:8px;padding:12px;text-align:center;color:#27500A;font-size:18px;font-weight:600;">🎯 총 ${totalTurns}턴 부여 예정</div>`+
    `<div style="margin-top:6px;font-size:12px;color:#888;text-align:center;">30분 = 1턴</div>`;
  goPage("pg-approval");
});

// 게임으로 돌아가기 (승인 대기 유지)
$("btn-back-game").addEventListener("click",()=>{
  goPage("pg-game");
  renderGame();
});

// 다른 미션 추가 입력 (승인 대기 중에도 추가 가능)
$("btn-add-mission").addEventListener("click",()=>{
  // 현재 본인 인덱스로 미션 화면 다시 열기
  if(gameState&&myName){
    const pi=gameState.players.findIndex(p=>p.name===myName);
    if(pi!==-1) openMission(pi);
  }
});
