<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지뢰찾기 멀티플레이어</title>

<!-- =====================================================================
  🔥 FIREBASE 설정 방법
  -----------------------------------------------------------------------
  1. https://console.firebase.google.com 접속 → 새 프로젝트 생성
  2. 프로젝트 설정 → 앱 추가 → 웹(</>)
  3. 아래 firebaseConfig 값을 본인 프로젝트 값으로 교체
  4. Firebase 콘솔 → Realtime Database → 데이터베이스 만들기 (테스트 모드)
  5. 이 HTML 파일을 GitHub Pages / Netlify / 로컬 서버로 열기
     (file:// 로 직접 열면 Firebase 연결 불가 — 반드시 http/https 필요)
  ===================================================================== -->

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get, onValue, update, runTransaction }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ⚠️ 아래 값을 Firebase 콘솔에서 복사한 본인 설정으로 교체하세요
const firebaseConfig = {
apiKey: "AIzaSyDNiGqAegBSED4h-IJjzj9EkTR814Hlf2M",
    authDomain: "snailbumbroom-13b73.firebaseapp.com",
    databaseURL: "https://snailbumbroom-13b73-default-rtdb.firebaseio.com",
    projectId: "snailbumbroom-13b73",
    storageBucket: "snailbumbroom-13b73.firebasestorage.app",
    messagingSenderId: "983942434316",
    appId: "1:983942434316:web:948e08906badf01f2ca829"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // =========================================================
  // 상수
  // =========================================================
  const ROWS = 20, COLS = 20;
  const MISSIONS = [
    { id:1, name:"흘듣",   maxH:2   },
    { id:2, name:"집듣",   maxH:null},
    { id:3, name:"영어책", maxH:null},
    { id:4, name:"수학",   maxH:null},
    { id:5, name:"한글책", maxH:null},
    { id:6, name:"음미체", maxH:2   }
  ];
  const COLORS = [
    { bg:"#B5D4F4", fg:"#0C447C" },
    { bg:"#C0DD97", fg:"#27500A" },
    { bg:"#FAC775", fg:"#633806" },
    { bg:"#F4C0D1", fg:"#72243E" }
  ];

  // =========================================================
  // 상태 (로컬 캐시 — Firebase 값 반영)
  // =========================================================
  let ROOM_ID  = null;
  let adminPw  = "";
  let myName   = "";   // 이 기기가 어떤 플레이어인지
  let gameState = null; // Firebase에서 내려온 전체 상태

  // 미션 입력 화면용 임시 상태
  let missionFor     = null;
  let selMissionId   = null;
  let approvalFor    = null;
  let approvalMission = "";
  let approvalSecs   = 0;

  // =========================================================
  // 유틸
  // =========================================================
  function $(id){ return document.getElementById(id); }
  function showErr(id, msg){ $(id).textContent = msg; $(id).classList.remove("hidden"); }
  function hideErr(id){ $(id).classList.add("hidden"); }
  function showScreen(id){
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
  }
  function fmtSecs(s){
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
    return h > 0 ? `${h}시간 ${m}분` : `${m}분`;
  }
  function setMsg(m){ $("game-msg").textContent = m; }
  function badge(name, color){
    return `<div style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;background:${COLORS[color].bg};color:${COLORS[color].fg};flex-shrink:0;">${name[0].toUpperCase()}</div>`;
  }

  // =========================================================
  // Firebase helpers
  // =========================================================
  function roomRef(path = ""){ return ref(db, `rooms/${ROOM_ID}${path ? "/" + path : ""}`); }

  async function syncState(){
    const snap = await get(roomRef());
    if(snap.exists()) gameState = snap.val();
    return gameState;
  }

  function listenState(){
    onValue(roomRef(), snap => {
      if(!snap.exists()) return;
      gameState = snap.val();
      if(gameState.phase === "game") renderGame();
    });
  }

  // =========================================================
  // 방 만들기 / 입장
  // =========================================================
  $("btn-create-room").addEventListener("click", async () => {
    const pw = $("admin-pw-input").value.trim();
    const mc = parseInt($("mine-count-input").value) || 15;
    const names = [0,1,2,3].map(i => $(`pname-${i}`).value.trim());

    if(!pw)                           { showErr("create-err","관리자 비밀번호를 입력하세요."); return; }
    if(mc < 1 || mc > 300)            { showErr("create-err","지뢰 수는 1~300개입니다."); return; }
    if(names.some(n => !n))           { showErr("create-err","4명의 이름을 모두 입력하세요."); return; }
    if(new Set(names).size !== 4)     { showErr("create-err","이름이 중복되었습니다."); return; }

    adminPw = pw;
    ROOM_ID = Math.random().toString(36).slice(2,8).toUpperCase();

    const players = names.map((name, i) => ({
      name, color: i, turns: 0, pending: false, log: []
    }));

    const initState = {
      phase: "game",
      mines: mc,
      adminPwHash: btoa(pw),   // 간단 난독화 (보안용 아님)
      players,
      board: null,             // 첫 클릭 때 생성
      revealed: Array(ROWS*COLS).fill(false),
      flagged:  Array(ROWS*COLS).fill(false),
      gameOver: false,
      gameWon:  false,
      firstClick: true,
      msg: ""
    };

    await set(roomRef(), initState);
    gameState = initState;

    $("room-id-display").textContent = ROOM_ID;
    showScreen("screen-room-created");
    listenState();
  });

  $("btn-join-room").addEventListener("click", async () => {
    const rid = $("join-room-id").value.trim().toUpperCase();
    const name = $("join-name").value.trim();
    if(!rid || !name){ showErr("join-err","방 ID와 이름을 입력하세요."); return; }

    ROOM_ID = rid;
    const snap = await get(roomRef());
    if(!snap.exists()){ showErr("join-err","존재하지 않는 방입니다."); return; }
    gameState = snap.val();

    const found = gameState.players.find(p => p.name === name);
    if(!found){ showErr("join-err","이름이 플레이어 목록에 없습니다."); return; }

    myName = name;
    showScreen("screen-game");
    listenState();
    renderGame();
  });

  $("btn-enter-game").addEventListener("click", () => {
    myName = gameState.players[0].name; // 방장은 첫 번째 플레이어
    showScreen("screen-game");
    renderGame();
  });

  // =========================================================
  // 지뢰 배치 (첫 클릭 시 서버에 저장)
  // =========================================================
  function generateBoard(sr, sc, mines){
    const board = Array(ROWS*COLS).fill(0);
    let placed = 0;
    while(placed < mines){
      const idx = Math.floor(Math.random() * ROWS * COLS);
      const r = Math.floor(idx/COLS), c = idx%COLS;
      if(board[idx] === -1) continue;
      if(Math.abs(r-sr)<=1 && Math.abs(c-sc)<=1) continue;
      board[idx] = -1; placed++;
    }
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      if(board[r*COLS+c]===-1) continue;
      let cnt=0;
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
        const nr=r+dr, nc=c+dc;
        if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&board[nr*COLS+nc]===-1) cnt++;
      }
      board[r*COLS+c]=cnt;
    }
    return board;
  }

  function floodReveal(board, revealed, r, c){
    if(r<0||r>=ROWS||c<0||c>=COLS) return;
    if(revealed[r*COLS+c]) return;
    revealed[r*COLS+c]=true;
    if(board[r*COLS+c]===0)
      for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) floodReveal(board,revealed,r+dr,c+dc);
  }

  function checkWin(board, revealed){
    for(let i=0;i<ROWS*COLS;i++) if(!revealed[i] && board[i]!==-1) return false;
    return true;
  }

  // =========================================================
  // 클릭 처리
  // =========================================================
  async function handleCellClick(r, c, playerIdx){
    await syncState();
    const gs = gameState;
    if(gs.gameOver || gs.gameWon) return;

    const p = gs.players[playerIdx];
    if(p.turns <= 0){
      setMsg(`${p.name}님 턴이 없어요! 미션을 완료하고 승인을 받으세요.`);
      return;
    }

    const idx = r*COLS+c;
    if(gs.revealed[idx] || gs.flagged[idx]) return;

    const updates = {};

    let board = gs.board;
    if(gs.firstClick){
      board = generateBoard(r, c, gs.mines);
      updates["board"] = board;
      updates["firstClick"] = false;
    }

    if(board[idx] === -1){
      const newRevealed = [...gs.revealed];
      newRevealed[idx] = true;
      updates["revealed"] = newRevealed;
      updates["gameOver"] = true;
      updates["msg"] = `💥 ${p.name}님이 지뢰를 밟았습니다! 게임 오버`;
    } else {
      const newRevealed = [...gs.revealed];
      floodReveal(board, newRevealed, r, c);
      updates["revealed"] = newRevealed;

      const newPlayers = gs.players.map((pl,i) =>
        i === playerIdx ? { ...pl, turns: pl.turns - 1 } : pl
      );
      updates["players"] = newPlayers;

      if(checkWin(board, newRevealed)){
        updates["gameWon"] = true;
        updates["msg"] = `🎉 ${p.name}님이 마지막 칸을 열었습니다! 클리어!`;
      }
    }

    await update(roomRef(), updates);
  }

  async function handleFlag(r, c){
    await syncState();
    const gs = gameState;
    if(gs.gameOver || gs.gameWon) return;
    const idx = r*COLS+c;
    if(gs.revealed[idx]) return;
    const newFlagged = [...gs.flagged];
    newFlagged[idx] = !newFlagged[idx];
    await update(roomRef(), { flagged: newFlagged });
  }

  // =========================================================
  // 렌더 — 게임 화면
  // =========================================================
  function renderGame(){
    const gs = gameState;
    if(!gs) return;

    // 지뢰 카운터
    const flagCount = (gs.flagged||[]).filter(Boolean).length;
    $("mines-left").textContent = gs.mines - flagCount;

    if(gs.msg) setMsg(gs.msg);

    renderPlayers();
    renderBoard();
  }

  function renderPlayers(){
    const gs = gameState;
    const grid = $("players-grid");
    grid.innerHTML = gs.players.map((p, i) => {
      const hasTurn = p.turns > 0;
      const lastLog = p.log && p.log.length ? p.log[p.log.length-1] : "";
      const statusStyle = hasTurn
        ? "background:#EAF3DE;color:#27500A;"
        : p.pending
          ? "background:#FAEEDA;color:#633806;"
          : "background:#f1f1ef;color:#888;";
      const statusTxt = hasTurn ? "턴 있음" : p.pending ? "승인 대기" : "미션 필요";

      return `
        <div style="border:0.5px solid ${hasTurn?"#3B6D11":"#ddd"};border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:${hasTurn?"#f8fff4":"var(--color-bg,#fff)"};">
          <div style="display:flex;align-items:center;gap:8px;">
            ${badge(p.name, p.color)}
            <span style="font-size:13px;font-weight:500;">${p.name}</span>
          </div>
          <div style="text-align:center;">
            <div style="font-size:28px;font-weight:500;">${p.turns}</div>
            <div style="font-size:11px;color:#888;">턴</div>
          </div>
          <div style="font-size:11px;padding:2px 8px;border-radius:20px;text-align:center;${statusStyle}">${statusTxt}</div>
          <button onclick="openMission(${i})" ${p.pending?"disabled":""} style="width:100%;padding:7px 4px;font-size:12px;border:0.5px solid #ccc;border-radius:8px;background:#f8f8f8;cursor:pointer;">
            ${p.pending ? "⏳ 승인 대기" : "미션 입력"}
          </button>
          <div style="font-size:10px;color:#aaa;min-height:14px;">${lastLog}</div>
        </div>`;
    }).join("");
  }

  function renderBoard(){
    const gs = gameState;
    const board = $("board");
    board.innerHTML = "";

    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
      const idx = r*COLS+c;
      const el = document.createElement("div");
      el.className = "cell";

      if(gs.revealed && gs.revealed[idx]){
        el.classList.add("revealed");
        const v = gs.board ? gs.board[idx] : 0;
        if(v === -1){
          el.classList.add("mine-hit");
          el.textContent = "💣";
        } else if(v > 0){
          el.textContent = v;
          el.classList.add(`n${v}`);
        }
      } else if(gs.flagged && gs.flagged[idx]){
        el.classList.add("flagged");
        el.textContent = "🚩";
      } else if((gs.gameOver||gs.gameWon) && gs.board && gs.board[idx]===-1){
        el.classList.add("mine-show");
        el.textContent = "💣";
      }

      if(!gs.gameOver && !gs.gameWon){
        el.addEventListener("contextmenu", e => { e.preventDefault(); handleFlag(r,c); });
        el.addEventListener("click", () => showPlayerPicker(r,c));
      }

      board.appendChild(el);
    }
  }

  // =========================================================
  // 플레이어 선택 팝업
  // =========================================================
  function showPlayerPicker(r, c){
    if(!gameState || gameState.gameOver || gameState.gameWon) return;
    const idx = r*COLS+c;
    if(gameState.revealed && gameState.revealed[idx]) return;
    if(gameState.flagged  && gameState.flagged[idx])  return;

    $("picker-r").value = r;
    $("picker-c").value = c;
    const btns = $("picker-btns");
    btns.innerHTML = gameState.players.map((p, i) => `
      <button onclick="pickPlayer(${i})" style="padding:8px 12px;border:0.5px solid ${p.turns>0?"#3B6D11":"#ccc"};border-radius:8px;background:${p.turns>0?"#EAF3DE":"#f8f8f8"};cursor:pointer;display:flex;align-items:center;gap:6px;">
        ${badge(p.name, p.color)}
        <span style="font-size:13px;">${p.name} (${p.turns}턴)</span>
      </button>`).join("");
    $("player-picker").style.display = "block";
  }

  window.pickPlayer = async (i) => {
    $("player-picker").style.display = "none";
    const r = parseInt($("picker-r").value);
    const c = parseInt($("picker-c").value);
    await handleCellClick(r, c, i);
  };

  window.closePicker = () => { $("player-picker").style.display = "none"; };

  // =========================================================
  // 미션 입력
  // =========================================================
  window.openMission = (idx) => {
    missionFor = idx;
    selMissionId = null;
    const p = gameState.players[idx];
    $("m-badge").innerHTML = badge(p.name, p.color);
    $("m-title").textContent = `${p.name}님 미션 입력`;
    $("inp-h").value = "0";
    $("inp-m").value = "0";
    $("time-hint").textContent = "미션을 먼저 선택하세요";
    hideErr("mission-sel-err"); hideErr("time-err");
    renderMissionGrid();
    showScreen("screen-mission");
  };

  function renderMissionGrid(){
    const grid = $("mission-grid");
    grid.innerHTML = MISSIONS.map(m => {
      const sel = selMissionId === m.id;
      const subText = m.maxH ? `최대 ${m.maxH}시간` : "무제한";
      return `<div class="mission-btn${sel?" sel":""}" onclick="selMission(${m.id})">
        ${m.name}<div style="font-size:11px;color:${sel?"#185FA5":"#aaa"};margin-top:3px;">${subText}</div>
      </div>`;
    }).join("");
  }

  window.selMission = (mid) => {
    selMissionId = mid;
    const m = MISSIONS.find(x => x.id === mid);
    $("time-hint").textContent = m.maxH ? `최대 ${m.maxH}시간까지 입력 가능` : "시간 제한 없음";
    renderMissionGrid();
    hideErr("mission-sel-err");
  };

  window.submitMission = () => {
    if(!selMissionId){ showErr("mission-sel-err","미션을 선택하세요."); return; }
    const h = parseInt($("inp-h").value)||0;
    const min = parseInt($("inp-m").value)||0;
    const secs = h*3600 + min*60;
    if(secs <= 0){ showErr("time-err","1분 이상 입력하세요."); return; }
    const m = MISSIONS.find(x => x.id === selMissionId);
    if(m.maxH && secs > m.maxH*3600){ showErr("time-err",`${m.name}은 최대 ${m.maxH}시간까지만 인정됩니다.`); return; }

    approvalFor = missionFor;
    approvalMission = m.name;
    approvalSecs = secs;
    const timeStr = h>0 ? `${h}시간 ${min}분` : `${min}분`;
    $("approval-desc").textContent =
      `${gameState.players[missionFor].name}님이 [${m.name}] 미션을 ${timeStr} 수행했습니다.\n승인하면 1턴이 부여됩니다.`;
    $("approval-pw").value = "";
    hideErr("approval-err");
    showScreen("screen-approval");
  };

  window.cancelApproval = () => showScreen("screen-mission");

  window.doApprove = async () => {
    if($("approval-pw").value !== adminPw &&
       $("approval-pw").value !== atob(gameState.adminPwHash||"")){
      showErr("approval-err","비밀번호가 틀렸습니다"); return;
    }
    await syncState();
    const gs = gameState;
    const h = Math.floor(approvalSecs/3600), min = Math.floor((approvalSecs%3600)/60);
    const timeStr = h>0 ? `${h}시간 ${min}분` : `${min}분`;
    const newPlayers = gs.players.map((pl, i) => {
      if(i !== approvalFor) return pl;
      const newLog = [...(pl.log||[]), `${approvalMission} ${timeStr}`];
      return { ...pl, turns: pl.turns+1, pending: false, log: newLog };
    });
    await update(roomRef(), {
      players: newPlayers,
      msg: `✅ ${gs.players[approvalFor].name}님에게 1턴 부여! (${approvalMission} ${timeStr})`
    });
    approvalFor = null;
    showScreen("screen-game");
  };

  // =========================================================
  // 관리자
  // =========================================================
  window.openAdmin = () => {
    $("admin-panel-pw").value = "";
    hideErr("admin-panel-err");
    $("admin-login-sec").classList.remove("hidden");
    $("admin-content").classList.add("hidden");
    showScreen("screen-admin");
  };

  window.adminLogin = () => {
    const entered = $("admin-panel-pw").value;
    const correct = adminPw || atob(gameState?.adminPwHash||"");
    if(entered !== correct){ showErr("admin-panel-err","비밀번호가 틀렸습니다"); return; }
    if(!adminPw) adminPw = entered;
    hideErr("admin-panel-err");
    $("admin-login-sec").classList.add("hidden");
    $("admin-mine-input").value = gameState.mines;
    $("admin-cur-mines").textContent = gameState.mines;
    $("admin-player-list").innerHTML = gameState.players.map((p, i) => `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;">
        ${badge(p.name, p.color)}
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:500;">${p.name}</div>
          <div style="font-size:11px;color:#888;">턴 ${p.turns}회</div>
        </div>
        <button onclick="adminGive(${i})" style="padding:5px 10px;border:0.5px solid #3B6D11;border-radius:8px;color:#27500A;background:#EAF3DE;cursor:pointer;font-size:12px;">+1턴</button>
        <button onclick="adminRemove(${i})" style="padding:5px 10px;border:0.5px solid #E24B4A;border-radius:8px;color:#791F1F;background:#FCEBEB;cursor:pointer;font-size:12px;">-1턴</button>
      </div>`).join("");
    $("admin-content").classList.remove("hidden");
  };

  window.adminChangeMines = async () => {
    const v = parseInt($("admin-mine-input").value)||15;
    if(v<1||v>300){ alert("1~300 사이로 입력하세요."); return; }
    await update(roomRef(), {
      mines: v,
      board: null,
      revealed: Array(ROWS*COLS).fill(false),
      flagged:  Array(ROWS*COLS).fill(false),
      gameOver: false,
      gameWon:  false,
      firstClick: true,
      msg: `관리자가 지뢰를 ${v}개로 변경하고 새 게임을 시작했습니다.`
    });
    showScreen("screen-game");
  };

  window.adminGive = async (i) => {
    await syncState();
    const newPlayers = gameState.players.map((pl,j) =>
      j===i ? {...pl, turns: pl.turns+1} : pl
    );
    await update(roomRef(), { players: newPlayers,
      msg:`관리자: ${gameState.players[i].name}님 +1턴` });
    showScreen("screen-game");
  };

  window.adminRemove = async (i) => {
    await syncState();
    const newPlayers = gameState.players.map((pl,j) =>
      j===i ? {...pl, turns: Math.max(0, pl.turns-1)} : pl
    );
    await update(roomRef(), { players: newPlayers });
    showScreen("screen-game");
  };
</script>

<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
  --bg:#ffffff; --bg2:#f5f5f3; --bg3:#eeede8;
  --text:#1a1a1a; --text2:#666; --text3:#aaa;
  --border:#e0e0e0; --border2:#ccc;
  --radius:8px; --radius-lg:12px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e1e1e; --bg2:#2a2a2a; --bg3:#333;
    --text:#f0f0f0; --text2:#aaa; --text3:#666;
    --border:#3a3a3a; --border2:#555;
  }
}
body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
#app{ padding:1rem; display:flex; flex-direction:column; align-items:center; gap:12px; max-width:1000px; margin:0 auto; }
.screen{ width:100%; max-width:960px; display:none; flex-direction:column; gap:12px; }
.screen.active{ display:flex; }
.card{ background:var(--bg); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:1.25rem; }
.card-title{ font-size:14px; font-weight:500; margin-bottom:10px; }
input[type=text],input[type=password],input[type=number]{
  width:100%; padding:8px 10px; border:0.5px solid var(--border2); border-radius:var(--radius);
  background:var(--bg2); color:var(--text); font-size:14px; outline:none;
}
input:focus{ border-color:#555; }
.btn{ padding:8px 14px; border:0.5px solid var(--border2); border-radius:var(--radius); background:var(--bg); color:var(--text); font-size:13px; cursor:pointer; transition:background .1s; }
.btn:hover{ background:var(--bg2); }
.btn-primary{ background:var(--text); color:var(--bg); border-color:var(--text); }
.btn-primary:hover{ opacity:.82; background:var(--text); }
.btn-sm{ padding:5px 10px; font-size:12px; }
.btn-success{ border-color:#3B6D11; color:#27500A; }
.btn-success:hover{ background:#EAF3DE; }
.btn-danger{ border-color:#E24B4A; color:#791F1F; }
.btn-danger:hover{ background:#FCEBEB; }
.err{ font-size:12px; color:#E24B4A; margin-top:6px; }
.hidden{ display:none!important; }

/* player slots */
.player-slots{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.player-slot{ border:0.5px solid var(--border); border-radius:var(--radius); padding:10px; }
.slot-label{ font-size:11px; color:var(--text3); margin-bottom:4px; }
.slot-row{ display:flex; gap:6px; align-items:center; }

/* board */
#board-wrap{ overflow-x:auto; width:100%; display:flex; justify-content:center; padding:0 .5rem; }
#board{ display:grid; grid-template-columns:repeat(20,39px); gap:2px; }
.cell{ width:39px; height:39px; border:0.5px solid var(--border2); border-radius:4px; background:var(--bg2); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:500; cursor:pointer; user-select:none; transition:background .08s; }
.cell:hover:not(.revealed):not(.flagged){ background:var(--bg); border-color:#888; }
.cell.revealed{ background:var(--bg); cursor:default; border-color:var(--border); }
.cell.flagged{ background:#FAEEDA; border-color:#EF9F27; }
.cell.mine-hit{ background:#FCEBEB; border-color:#E24B4A; }
.cell.mine-show{ color:#E24B4A; }
.n1{color:#185FA5;}.n2{color:#3B6D11;}.n3{color:#A32D2D;}
.n4{color:#3C3489;}.n5{color:#993C1D;}.n6{color:#0F6E56;}
.n7{color:#72243E;}.n8{color:#888;}

/* players grid */
.players-grid{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; }

/* status bar */
.status-inner{ display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:var(--bg2); border-radius:var(--radius); font-size:12px; }

/* mission */
.mission-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.mission-btn{ padding:10px 8px; border:0.5px solid var(--border2); border-radius:var(--radius); background:var(--bg2); color:var(--text); font-size:13px; cursor:pointer; text-align:center; transition:background .1s; }
.mission-btn:hover{ background:var(--bg); border-color:#888; }
.mission-btn.sel{ border:2px solid #185FA5; background:#E6F1FB; color:#0C447C; }
.time-row{ display:flex; gap:8px; align-items:center; }
.time-row input{ width:80px; text-align:center; }
.time-lbl{ font-size:13px; color:var(--text2); }

/* picker */
#player-picker{ display:none; width:100%; max-width:960px; }
.picker-inner{ background:var(--bg); border:0.5px solid #185FA5; border-radius:var(--radius-lg); padding:12px; }

/* room code */
.room-code{ font-size:40px; font-weight:700; letter-spacing:6px; text-align:center; padding:1rem; background:var(--bg2); border-radius:var(--radius-lg); border:0.5px solid var(--border); }
</style>
</head>
<body>
<div id="app">

<!-- ===== 입장 화면 ===== -->
<div class="screen active" id="screen-lobby">
  <div style="text-align:center; padding:1rem 0;">
    <div style="font-size:24px; font-weight:600; margin-bottom:4px;">💣 지뢰찾기 멀티플레이어</div>
    <div style="font-size:13px; color:#888;">Firebase 실시간 동기화</div>
  </div>

  <div class="card">
    <div class="card-title">🏠 새 방 만들기</div>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input type="password" id="admin-pw-input" placeholder="관리자 비밀번호" style="flex:1;">
    </div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;">
      <input type="number" id="mine-count-input" value="15" min="1" max="300" style="width:90px;">
      <span style="font-size:13px;color:#888;">개 지뢰 (1~300)</span>
    </div>
    <div class="player-slots">
      <div class="player-slot"><div class="slot-label">플레이어 1</div><div class="slot-row"><input type="text" id="pname-0" placeholder="이름" maxlength="8"></div></div>
      <div class="player-slot"><div class="slot-label">플레이어 2</div><div class="slot-row"><input type="text" id="pname-1" placeholder="이름" maxlength="8"></div></div>
      <div class="player-slot"><div class="slot-label">플레이어 3</div><div class="slot-row"><input type="text" id="pname-2" placeholder="이름" maxlength="8"></div></div>
      <div class="player-slot"><div class="slot-label">플레이어 4</div><div class="slot-row"><input type="text" id="pname-3" placeholder="이름" maxlength="8"></div></div>
    </div>
    <div class="err hidden" id="create-err"></div>
    <button id="btn-create-room" class="btn btn-primary" style="width:100%;margin-top:12px;padding:12px;">방 만들기</button>
  </div>

  <div class="card">
    <div class="card-title">🚪 방 입장하기</div>
    <div style="display:flex;gap:8px;margin-bottom:8px;">
      <input type="text" id="join-room-id" placeholder="방 코드 (6자리)" maxlength="6" style="width:140px;letter-spacing:3px;font-weight:600;">
      <input type="text" id="join-name" placeholder="내 이름" maxlength="8" style="flex:1;">
    </div>
    <div class="err hidden" id="join-err"></div>
    <button id="btn-join-room" class="btn" style="width:100%;padding:10px;">입장하기</button>
  </div>
</div>

<!-- ===== 방 생성 완료 ===== -->
<div class="screen" id="screen-room-created">
  <div class="card" style="text-align:center;">
    <div class="card-title" style="text-align:center;">방이 생성되었습니다!</div>
    <div style="font-size:13px;color:#888;margin-bottom:12px;">이 코드를 친구들에게 공유하세요</div>
    <div class="room-code" id="room-id-display">------</div>
    <div style="font-size:12px;color:#aaa;margin-top:8px;">친구들은 위 코드와 본인 이름으로 입장합니다</div>
    <button id="btn-enter-game" class="btn btn-primary" style="width:100%;margin-top:16px;padding:12px;">게임 시작 →</button>
  </div>
</div>

<!-- ===== 게임 화면 ===== -->
<div class="screen" id="screen-game">
  <div class="status-inner" style="width:100%;">
    <div style="display:flex;align-items:center;gap:6px;font-weight:500;">💣 <span id="mines-left">15</span></div>
    <div id="game-msg" style="font-size:12px;flex:1;text-align:center;padding:0 8px;"></div>
    <button class="btn btn-sm" onclick="openAdmin()">관리자</button>
  </div>

  <div class="players-grid" id="players-grid"></div>

  <div id="player-picker">
    <div class="picker-inner">
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;">누가 이 칸을 여나요?</div>
      <div id="picker-btns" style="display:flex;gap:8px;flex-wrap:wrap;"></div>
      <button class="btn btn-sm" onclick="closePicker()" style="margin-top:8px;width:100%;">취소</button>
    </div>
  </div>
  <input type="hidden" id="picker-r">
  <input type="hidden" id="picker-c">

  <div id="board-wrap"><div id="board"></div></div>
</div>

<!-- ===== 미션 입력 ===== -->
<div class="screen" id="screen-mission">
  <div class="card">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
      <span id="m-badge"></span>
      <div class="card-title" style="margin:0;" id="m-title">미션 입력</div>
    </div>
    <div class="mission-grid" id="mission-grid"></div>
    <div class="err hidden" id="mission-sel-err" style="margin-top:8px;"></div>
  </div>
  <div class="card">
    <div class="card-title">수행 시간 입력</div>
    <div style="font-size:12px;color:#888;margin-bottom:10px;" id="time-hint">미션을 먼저 선택하세요</div>
    <div class="time-row">
      <input type="number" id="inp-h" min="0" max="23" value="0">
      <span class="time-lbl">시간</span>
      <input type="number" id="inp-m" min="0" max="59" value="0">
      <span class="time-lbl">분</span>
    </div>
    <div class="err hidden" id="time-err" style="margin-top:8px;"></div>
  </div>
  <div style="display:flex;gap:8px;">
    <button class="btn btn-sm" onclick="showScreen('screen-game');renderGame();" style="flex:1;">← 취소</button>
    <button class="btn btn-primary" onclick="submitMission()" style="flex:2;padding:12px;">승인 요청 →</button>
  </div>
</div>

<!-- ===== 승인 화면 ===== -->
<div class="screen" id="screen-approval">
  <div class="card">
    <div class="card-title">관리자 승인</div>
    <div style="font-size:13px;color:#666;margin-bottom:10px;line-height:1.6;white-space:pre-line;" id="approval-desc"></div>
    <input type="password" id="approval-pw" placeholder="관리자 비밀번호 입력">
    <div class="err hidden" id="approval-err">비밀번호가 틀렸습니다</div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button class="btn btn-sm btn-danger" onclick="cancelApproval()">취소</button>
      <button class="btn btn-primary" onclick="doApprove()">✅ 승인</button>
    </div>
  </div>
</div>

<!-- ===== 관리자 패널 ===== -->
<div class="screen" id="screen-admin">
  <div class="card">
    <div class="card-title">관리자 패널</div>
    <div id="admin-login-sec">
      <input type="password" id="admin-panel-pw" placeholder="관리자 비밀번호">
      <div class="err hidden" id="admin-panel-err">비밀번호가 틀렸습니다</div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn btn-sm" onclick="showScreen('screen-game');renderGame();">닫기</button>
        <button class="btn btn-primary btn-sm" onclick="adminLogin()">로그인</button>
      </div>
    </div>
    <div class="hidden" id="admin-content">
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;">
        <span style="font-size:13px;font-weight:500;">지뢰 개수:</span>
        <input type="number" id="admin-mine-input" min="1" max="300" style="width:90px;">
        <button class="btn btn-sm btn-primary" onclick="adminChangeMines()">적용 (새 게임)</button>
        <span style="font-size:12px;color:#888;">현재 <span id="admin-cur-mines"></span>개</span>
      </div>
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;">플레이어 턴 조정</div>
      <div id="admin-player-list"></div>
      <button class="btn btn-sm" onclick="showScreen('screen-game');renderGame();" style="margin-top:12px;width:100%;">닫기</button>
    </div>
  </div>
</div>

</div><!-- #app -->
</body>
</html>
