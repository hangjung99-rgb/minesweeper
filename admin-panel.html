<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 패널</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#fff;--bg2:#f5f5f3;--bg3:#ebebeb;--text:#1a1a1a;--text2:#666;--text3:#aaa;--border:#e0e0e0;--border2:#ccc;--r:8px;--rlg:12px;}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a1a;--bg2:#252525;--bg3:#303030;--text:#f0f0f0;--text2:#aaa;--text3:#666;--border:#333;--border2:#444;}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg2);color:var(--text);min-height:100vh;}
.screen{display:none;min-height:100vh;}
.screen.on{display:flex;flex-direction:column;}
/* 로그인 */
#sc-login{align-items:center;justify-content:center;padding:2rem 1rem;}
.login-wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;}
.ltabs{display:flex;border:0.5px solid var(--border2);border-radius:var(--r);overflow:hidden;}
.ltab{flex:1;padding:11px;font-size:13px;border:none;background:var(--bg2);color:var(--text2);cursor:pointer;}
.ltab.active{background:var(--text);color:var(--bg);font-weight:500;}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rlg);padding:1.25rem;display:flex;flex-direction:column;gap:10px;}
input[type=text],input[type=password],input[type=number],select{width:100%;padding:9px 11px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);color:var(--text);font-size:14px;outline:none;}
input:focus,select:focus{border-color:#555;}
.btn{width:100%;padding:12px;border:none;border-radius:var(--r);background:var(--text);color:var(--bg);font-size:14px;font-weight:500;cursor:pointer;}
.btn:hover{opacity:.85;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.err{font-size:12px;color:#E24B4A;padding:7px 10px;background:#FCEBEB;border-radius:var(--r);display:none;}
.pslots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}
.pslot{border:0.5px solid var(--border2);border-radius:var(--r);padding:8px;}
.pslot-lbl{font-size:11px;color:var(--text3);margin-bottom:4px;}
.pslot-row{display:flex;gap:6px;align-items:center;}
.pslot-row input{flex:1;padding:6px 8px;font-size:13px;}
/* 방 생성 완료 */
#sc-created{align-items:center;justify-content:center;padding:2rem;}
.big-code{font-size:48px;font-weight:700;letter-spacing:8px;padding:1rem;background:var(--bg2);border-radius:var(--rlg);border:0.5px solid var(--border2);text-align:center;}
/* 대시보드 */
#sc-dash{max-width:680px;width:100%;margin:0 auto;padding:1rem;gap:12px;}
.dash-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.dash-title{font-size:18px;font-weight:600;}
.dash-sub{font-size:11px;color:var(--text3);margin-top:3px;}
.room-pill{font-size:13px;padding:5px 14px;border-radius:20px;background:var(--bg);border:0.5px solid var(--border);color:var(--text2);letter-spacing:3px;font-weight:700;}
.stage-pill{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--bg);border:0.5px solid var(--border);color:var(--text2);}
.tabs{display:flex;border:0.5px solid var(--border);border-radius:var(--rlg);overflow:hidden;background:var(--bg);}
.tab-btn{flex:1;padding:13px 6px;font-size:13px;border:none;background:transparent;color:var(--text2);cursor:pointer;}
.tab-btn:not(:last-child){border-right:0.5px solid var(--border);}
.tab-btn.active{background:var(--text);color:var(--bg);font-weight:500;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}
.pane-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rlg);padding:1.25rem;}
.pane-title{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:12px;}
/* 플레이어 행 */
.p-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;background:var(--bg2);flex-wrap:wrap;}
.p-row:last-child{margin-bottom:0;}
.p-left{display:flex;align-items:center;gap:10px;}
.p-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;}
.p-name{font-size:14px;font-weight:500;}
.p-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.turn-chip{font-size:13px;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--bg3);color:var(--text2);min-width:44px;text-align:center;}
.turn-chip.on{background:#EAF3DE;color:#27500A;}
.btn-plus{padding:5px 10px;border:0.5px solid #3B6D11;border-radius:var(--r);background:#EAF3DE;color:#27500A;font-size:13px;font-weight:700;cursor:pointer;}
.btn-minus{padding:5px 10px;border:0.5px solid #E24B4A;border-radius:var(--r);background:#FCEBEB;color:#791F1F;font-size:13px;font-weight:700;cursor:pointer;}
.btn-del{padding:5px 8px;border:0.5px solid #E24B4A;border-radius:var(--r);background:#FCEBEB;color:#791F1F;font-size:12px;cursor:pointer;}
.empty{font-size:13px;color:var(--text3);text-align:center;padding:24px 0;}
/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:#1a1a1a;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- 로그인 화면 -->
<div id="sc-login" class="screen on">
  <div class="login-wrap">
    <div style="font-size:40px;text-align:center;">💣</div>
    <div style="font-size:20px;font-weight:600;text-align:center;">관리자 패널</div>
    <div class="ltabs">
      <button class="ltab active" id="ltab-create">새 방 만들기</button>
      <button class="ltab" id="ltab-login">기존 방 로그인</button>
    </div>
    <!-- 방 만들기 패널 -->
    <div id="panel-create">
      <div class="card">
        <input type="password" id="create-pw" placeholder="관리자 비밀번호 설정">
        <div style="display:flex;gap:8px;align-items:center;">
          <select id="mine-count" style="width:160px;">
            <option value="10" selected>10개 (1번째 방)</option>
            <option value="20">20개 (2번째 방)</option>
            <option value="30">30개 (3번째 방)</option>
            <option value="50">50개 (5번째 방)</option>
          </select>
          <span style="font-size:13px;color:var(--text2);">지뢰</span>
        </div>
        <div>
          <div style="font-size:12px;color:var(--text3);margin-bottom:5px;">플레이어 수: <b id="pc-disp">14명</b></div>
          <input type="range" id="pc-slider" min="2" max="15" value="14" style="width:100%;">
          <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:2px;"><span>2명</span><span>15명</span></div>
        </div>
        <div id="name-inputs" class="pslots"></div>
        <div class="err" id="create-err"></div>
        <button class="btn" id="btn-create">방 만들기 →</button>
      </div>
    </div>
    <!-- 기존 방 로그인 패널 -->
    <div id="panel-login" style="display:none;">
      <div class="card">
        <div style="font-size:12px;color:var(--text3);">이미 만들어진 방에 관리자로 입장합니다</div>
        <input type="text" id="login-rid" placeholder="방 코드 (6자리)"
          style="text-align:center;letter-spacing:5px;font-weight:700;text-transform:uppercase;">
        <input type="password" id="login-pw" placeholder="관리자 비밀번호">
        <div class="err" id="login-err"></div>
        <button class="btn" id="btn-login">로그인 →</button>
      </div>
    </div>
  </div>
</div>

<!-- 방 생성 완료 -->
<div id="sc-created" class="screen">
  <div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;max-width:360px;width:100%;">
    <div style="font-size:32px;">🎉</div>
    <div style="font-size:20px;font-weight:600;">방이 생성되었습니다!</div>
    <div style="font-size:13px;color:var(--text2);">이 코드를 플레이어들에게 공유하세요</div>
    <div class="big-code" id="created-code">------</div>
    <div style="font-size:12px;color:var(--text3);line-height:1.8;">
      플레이어들은 <b style="color:var(--text2);">minesweeper-v2.html</b> 에서<br>방 코드를 입력해 입장해요
    </div>
    <button class="btn" id="btn-go-dash">관리자 대시보드 →</button>
  </div>
</div>

<!-- 대시보드 -->
<div id="sc-dash" class="screen">
  <div class="dash-head">
    <div>
      <div class="dash-title">💣 관리자 패널</div>
      <div class="dash-sub" id="notif-lbl">알림 확인 중...</div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
      <div class="stage-pill" id="stage-lbl"></div>
      <div class="room-pill" id="room-lbl">------</div>
      <button id="btn-logout" style="padding:4px 10px;border:0.5px solid var(--border2);border-radius:20px;background:var(--bg);color:var(--text3);font-size:11px;cursor:pointer;">로그아웃</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="players">👥 플레이어</button>
    <button class="tab-btn" data-tab="add">➕ 팀원 추가/삭제</button>
    <button class="tab-btn" data-tab="newroom">🆕 새 방</button>
  </div>

  <div class="tab-pane active" id="pane-players">
    <div class="pane-card">
      <div class="pane-title">플레이어 현황 & 턴 조정</div>
      <div id="player-list"><div class="empty">불러오는 중...</div></div>
    </div>
  </div>

  <div class="tab-pane" id="pane-add">
    <div class="pane-card">
      <div class="pane-title">팀원 추가</div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="add-name" placeholder="추가할 이름" maxlength="8" style="flex:1;">
        <button id="btn-add-player" style="padding:9px 16px;border:none;border-radius:var(--r);background:var(--text);color:var(--bg);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;">+ 추가</button>
      </div>
      <div class="err" id="add-err"></div>
      <div class="pane-title" style="margin-top:12px;">팀원 삭제</div>
      <div id="delete-list"><div class="empty">불러오는 중...</div></div>
    </div>
  </div>

  <div class="tab-pane" id="pane-newroom">
    <div class="pane-card">
      <div class="pane-title">새 방 만들기</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.7;margin-bottom:4px;">
        현재 플레이어와 턴 수를 유지한 채 새 방을 만들어요.<br>
        지뢰 수를 직접 설정할 수 있어요.
      </div>
      <!-- 현재 방 정보 -->
      <div id="newroom-info" style="background:var(--bg2);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--text2);"></div>
      <!-- 지뢰 수 설정 -->
      <div style="display:flex;gap:8px;align-items:center;margin-top:4px;">
        <label style="font-size:13px;color:var(--text2);white-space:nowrap;">지뢰 수:</label>
        <input type="number" id="newroom-mines" min="1" max="300" style="width:90px;">
        <span style="font-size:12px;color:var(--text3);">개</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;">
        <button class="mines-preset" data-mines="10" style="padding:6px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);cursor:pointer;font-size:12px;">10개</button>
        <button class="mines-preset" data-mines="20" style="padding:6px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);cursor:pointer;font-size:12px;">20개</button>
        <button class="mines-preset" data-mines="30" style="padding:6px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);cursor:pointer;font-size:12px;">30개</button>
        <button class="mines-preset" data-mines="50" style="padding:6px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);cursor:pointer;font-size:12px;">50개</button>
        <button class="mines-preset" data-mines="80" style="padding:6px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);cursor:pointer;font-size:12px;">80개</button>
        <button class="mines-preset" data-mines="100" style="padding:6px 12px;border:0.5px solid var(--border2);border-radius:var(--r);background:var(--bg2);cursor:pointer;font-size:12px;">100개</button>
      </div>
      <div class="err" id="newroom-err"></div>
      <button id="btn-make-newroom" style="width:100%;padding:13px;border:none;border-radius:var(--r);background:var(--text);color:var(--bg);font-size:14px;font-weight:500;cursor:pointer;margin-top:4px;">🆕 새 방 생성</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, onValue, update }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const FC = {
  apiKey:"AIzaSyDNiGqAegBSED4h-IJjzj9EkTR814Hlf2M",
  authDomain:"snailbumbroom-13b73.firebaseapp.com",
  databaseURL:"https://snailbumbroom-13b73-default-rtdb.firebaseio.com",
  projectId:"snailbumbroom-13b73",
  storageBucket:"snailbumbroom-13b73.firebasestorage.app",
  messagingSenderId:"983942434316",
  appId:"1:983942434316:web:948e08906badf01f2ca829"
};
const db = getDatabase(initializeApp(FC));

const COLORS=[
  {bg:"#B5D4F4",fg:"#0C447C"},{bg:"#C0DD97",fg:"#27500A"},
  {bg:"#FAC775",fg:"#633806"},{bg:"#F4C0D1",fg:"#72243E"},
  {bg:"#CECBF6",fg:"#3C3489"},{bg:"#9FE1CB",fg:"#085041"},
  {bg:"#F5C4B3",fg:"#712B13"},{bg:"#D3D1C7",fg:"#2C2C2A"},
  {bg:"#85B7EB",fg:"#042C53"},{bg:"#97C459",fg:"#173404"},
  {bg:"#ED93B1",fg:"#4B1528"},{bg:"#EF9F27",fg:"#412402"},
  {bg:"#5DCAA5",fg:"#04342C"},{bg:"#F09595",fg:"#501313"},
  {bg:"#7F77DD",fg:"#26215C"}
];
const DEFAULT_NAMES=["영이","지니","지아니","다니","오니","썸머","제이슨","코니","루이","윤율동","윤율형","숲","영롱쭌","봄2옴"];
const ROWS=30,COLS=30;

let ROOM_ID=null, adminPw="", gameState=null;
let playerCount=14;

const $=id=>document.getElementById(id);

// ── 화면 전환 ──
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on"));
  $(id).classList.add("on");
}

// ── 탭 전환 (로그인) ──
function switchLoginTab(tab){
  $("panel-create").style.display=tab==="create"?"block":"none";
  $("panel-login").style.display=tab==="login"?"block":"none";
  $("ltab-create").classList.toggle("active",tab==="create");
  $("ltab-login").classList.toggle("active",tab==="login");
}
$("ltab-create").addEventListener("click",()=>switchLoginTab("create"));
$("ltab-login").addEventListener("click",()=>switchLoginTab("login"));

// ── 탭 전환 (대시보드) ──
function switchTab(tab){
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".tab-pane").forEach(p=>p.classList.remove("active"));
  document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add("active");
  $("pane-"+tab).classList.add("active");
}
document.querySelectorAll(".tab-btn").forEach(b=>{
  b.addEventListener("click",()=>switchTab(b.dataset.tab));
});

// ── 플레이어 이름 입력 ──
function renderNameInputs(){
  const c=$("name-inputs"); if(!c) return;
  c.innerHTML="";
  for(let i=0;i<playerCount;i++){
    const col=COLORS[i%COLORS.length];
    const def=DEFAULT_NAMES[i]||"";
    const badge=def?def[0].toUpperCase():"?";
    c.innerHTML+=`<div class="pslot">
      <div class="pslot-lbl">플레이어 ${i+1}</div>
      <div class="pslot-row">
        <div id="pb-${i}" style="width:22px;height:22px;border-radius:50%;background:${col.bg};color:${col.fg};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0;">${badge}</div>
        <input type="text" id="pname-${i}" placeholder="이름" maxlength="8" value="${def}">
      </div>
    </div>`;
  }
  // 뱃지 업데이트 이벤트
  for(let i=0;i<playerCount;i++){
    const inp=$("pname-"+i);
    if(inp) inp.addEventListener("input",function(){
      const b=$("pb-"+i);
      if(b) b.textContent=this.value.trim()?this.value[0].toUpperCase():"?";
    });
  }
}
$("pc-slider").addEventListener("input",function(){
  playerCount=parseInt(this.value);
  $("pc-disp").textContent=playerCount+"명";
  renderNameInputs();
});
renderNameInputs();

// ── 방 만들기 ──
$("btn-create").addEventListener("click",async function(){
  const pw=$("create-pw").value.trim();
  const mc=parseInt($("mine-count").value)||10;
  const names=Array.from({length:playerCount},(_,i)=>($("pname-"+i)||{}).value||"").map(n=>n.trim());
  const errEl=$("create-err");
  errEl.style.display="none";
  if(!pw){errEl.textContent="관리자 비밀번호를 입력하세요.";errEl.style.display="block";return;}
  if(names.some(n=>!n)){errEl.textContent="모든 플레이어 이름을 입력하세요.";errEl.style.display="block";return;}
  if(new Set(names).size!==playerCount){errEl.textContent="이름이 중복되었습니다.";errEl.style.display="block";return;}
  adminPw=pw;
  ROOM_ID=Math.random().toString(36).slice(2,8).toUpperCase();
  const players=names.map((name,i)=>({name,color:i,turns:0,pending:false,pendingMission:"",pendingSecsVal:0,log:[]}));
  const init={
    phase:"game",mines:mc,adminPwHash:btoa(pw),playerCount,players,
    stageNum:1,clearedRooms:0,
    pendingJoin:{},board:null,
    revealed:Array(ROWS*COLS).fill(false),flagged:Array(ROWS*COLS).fill(false),
    gameOver:false,gameWon:false,firstClick:true,msg:""
  };
  this.disabled=true;this.textContent="생성 중...";
  try{
    await set(ref(db,"rooms/"+ROOM_ID),init);
    localStorage.setItem("admin_session",JSON.stringify({roomId:ROOM_ID,pw}));
    gameState=init;
    $("created-code").textContent=ROOM_ID;
    showScreen("sc-created");
    reqNotif();
    listenState();
  }catch(e){errEl.textContent="오류: "+e.message;errEl.style.display="block";}
  this.disabled=false;this.textContent="방 만들기 →";
});

// ── 기존 방 로그인 ──
$("login-rid").addEventListener("input",e=>e.target.value=e.target.value.toUpperCase());
$("btn-login").addEventListener("click",async function(){
  const rid=($("login-rid").value||"").trim().toUpperCase();
  const pw=($("login-pw").value||"").trim();
  const errEl=$("login-err");errEl.style.display="none";
  if(!rid||!pw){errEl.textContent="방 코드와 비밀번호를 입력하세요.";errEl.style.display="block";return;}
  this.disabled=true;this.textContent="확인 중...";
  ROOM_ID=rid;
  try{
    const snap=await get(ref(db,"rooms/"+ROOM_ID));
    if(!snap.exists()){errEl.textContent="존재하지 않는 방입니다.";errEl.style.display="block";reset();return;}
    const gs=snap.val();
    let correct="";try{correct=atob(gs.adminPwHash||"");}catch(e){correct=gs.adminPwHash||"";}
    if(pw!==correct){errEl.textContent="비밀번호가 틀렸습니다.";errEl.style.display="block";reset();return;}
    adminPw=pw;gameState=gs;
    localStorage.setItem("admin_session",JSON.stringify({roomId:ROOM_ID,pw}));
    enterDash();
    listenState();
  }catch(e){errEl.textContent="오류: "+e.message;errEl.style.display="block";reset();}
  function reset(){this.disabled=false;this.textContent="로그인 →";}
  this.disabled=false;this.textContent="로그인 →";
});

// ── 대시보드 진입 ──
function enterDash(){
  $("room-lbl").textContent=ROOM_ID;
  updateStageLbl();
  showScreen("sc-dash");
  renderAll();
  reqNotif();
}

$("btn-go-dash").addEventListener("click",()=>enterDash());
$("btn-logout").addEventListener("click",()=>{
  localStorage.removeItem("admin_session");
  ROOM_ID=null;adminPw="";gameState=null;
  showScreen("sc-login");
});

// ── 자동 로그인 ──
(async function tryAutoLogin(){
  try{
    const saved=localStorage.getItem("admin_session");
    if(!saved) return;
    const {roomId,pw}=JSON.parse(saved);
    if(!roomId||!pw) return;
    const snap=await get(ref(db,"rooms/"+roomId));
    if(!snap.exists()){localStorage.removeItem("admin_session");return;}
    const gs=snap.val();
    let correct="";try{correct=atob(gs.adminPwHash||"");}catch(e){correct=gs.adminPwHash||"";}
    if(pw!==correct){localStorage.removeItem("admin_session");return;}
    ROOM_ID=roomId;adminPw=pw;gameState=gs;
    enterDash();
    listenState();
  }catch(e){localStorage.removeItem("admin_session");}
})();

// ── 알림 ──
async function reqNotif(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="granted"){updateNotifLbl("on");return;}
  if(Notification.permission==="denied"){updateNotifLbl("off");return;}
  const r=await Notification.requestPermission();
  updateNotifLbl(r==="granted"?"on":"off");
}
function updateNotifLbl(s){
  const el=$("notif-lbl");if(!el)return;
  el.textContent=s==="on"?"🔔 브라우저 알림 켜짐":"🔕 알림 꺼짐";
}

// ── 실시간 ──
function listenState(){
  onValue(ref(db,"rooms/"+ROOM_ID),snap=>{
    if(!snap.exists()) return;
    gameState=snap.val();
    if($("sc-dash").classList.contains("on")){
      renderAll();
      updateStageLbl();
      // 새 방 감지
      if(gameState.nextRoomId&&gameState.nextRoomId!==ROOM_ID){
        ROOM_ID=gameState.nextRoomId;
        $("room-lbl").textContent=ROOM_ID;
        localStorage.setItem("admin_session",JSON.stringify({roomId:ROOM_ID,pw:adminPw}));
        listenState();
        toast("새 방 코드: "+ROOM_ID);
      }
    }
  });
}

function updateStageLbl(){
  const el=$("stage-lbl");if(!el||!gameState) return;
  el.textContent="🏠 "+(gameState.stageNum||1)+"번째 방 | 💣"+(gameState.mines||10)+"개 | 클리어 "+(gameState.clearedRooms||0)+"회";
}

// ── 렌더 ──
function renderAll(){
  renderPlayers();
  renderDeleteList();
  renderNewRoomInfo();
}

function renderPlayers(){
  const el=$("player-list");
  if(!el) return;
  if(!gameState||!gameState.players||gameState.players.length===0){
    el.innerHTML='<div class="empty">플레이어가 없어요</div>';return;
  }
  el.innerHTML="";
  gameState.players.forEach(function(p,i){
    const col=COLORS[(p.color||i)%COLORS.length];
    const lastLog=p.log&&p.log.length?"최근: "+p.log[p.log.length-1]:"기록 없음";
    const row=document.createElement("div");
    row.className="p-row";
    row.innerHTML=
      '<div class="p-left">'+
        '<div class="av" style="background:'+col.bg+';color:'+col.fg+';">'+p.name[0].toUpperCase()+'</div>'+
        '<div><div class="p-name">'+p.name+'</div><div class="p-sub">'+lastLog+'</div></div>'+
      '</div>'+
      '<div class="p-right">'+
        '<div class="turn-chip '+(p.turns>0?"on":"")+'">'+p.turns+'턴</div>'+
        '<button class="btn-plus">+1</button>'+
        '<button class="btn-minus">−1</button>'+
      '</div>';
    row.querySelector(".btn-plus").addEventListener("click",()=>giveTurn(i));
    row.querySelector(".btn-minus").addEventListener("click",()=>removeTurn(i));
    el.appendChild(row);
  });
}

function renderDeleteList(){
  const el=$("delete-list");
  if(!el) return;
  if(!gameState||!gameState.players||gameState.players.length===0){
    el.innerHTML='<div class="empty">플레이어가 없어요</div>';return;
  }
  el.innerHTML="";
  gameState.players.forEach(function(p,i){
    const col=COLORS[(p.color||i)%COLORS.length];
    const row=document.createElement("div");
    row.className="p-row";
    row.innerHTML=
      '<div class="p-left">'+
        '<div class="av" style="background:'+col.bg+';color:'+col.fg+';">'+p.name[0].toUpperCase()+'</div>'+
        '<div class="p-name">'+p.name+'</div>'+
      '</div>'+
      '<button class="btn-del">🗑 삭제</button>';
    row.querySelector(".btn-del").addEventListener("click",()=>deletePlayer(i));
    el.appendChild(row);
  });
}

// ── 액션 ──
async function giveTurn(i){
  if(!gameState||!gameState.players) return;
  const np=gameState.players.map((p,j)=>j===i?Object.assign({},p,{turns:p.turns+1}):p);
  await update(ref(db,"rooms/"+ROOM_ID),{players:np,msg:"관리자: "+gameState.players[i].name+"님 +1턴"});
  toast(gameState.players[i].name+"님 +1턴");
}
async function removeTurn(i){
  if(!gameState||!gameState.players) return;
  const np=gameState.players.map((p,j)=>j===i?Object.assign({},p,{turns:Math.max(0,p.turns-1)}):p);
  await update(ref(db,"rooms/"+ROOM_ID),{players:np});
  toast(gameState.players[i].name+"님 -1턴");
}
async function deletePlayer(i){
  if(!gameState||!gameState.players) return;
  const p=gameState.players[i];
  if(!confirm('"'+p.name+'"님을 삭제할까요?')) return;
  const np=gameState.players.filter((_,j)=>j!==i);
  await update(ref(db,"rooms/"+ROOM_ID),{players:np,playerCount:np.length});
  toast(p.name+"님 삭제 완료");
}

// ── 팀원 추가 ──
$("btn-add-player").addEventListener("click",async function(){
  const name=($("add-name").value||"").trim();
  const errEl=$("add-err");errEl.style.display="none";
  if(!name){errEl.textContent="이름을 입력하세요.";errEl.style.display="block";return;}
  if(!gameState||!gameState.players){errEl.textContent="게임 데이터 없음";errEl.style.display="block";return;}
  if(gameState.players.find(p=>p.name===name)){errEl.textContent='"'+name+'"은 이미 있는 이름이에요.';errEl.style.display="block";return;}
  const nc=gameState.players.length%COLORS.length;
  const np=gameState.players.concat([{name,color:nc,turns:0,pending:false,pendingMission:"",pendingSecsVal:0,log:[]}]);
  await update(ref(db,"rooms/"+ROOM_ID),{players:np,playerCount:np.length,msg:"관리자: "+name+"님이 팀에 합류했어요! 👋"});
  $("add-name").value="";
  toast(name+"님 추가 완료!");
});
$("add-name").addEventListener("keydown",e=>{if(e.key==="Enter")$("btn-add-player").click();});

// ── 새 방 탭 ──
function renderNewRoomInfo(){
  const el=document.getElementById("newroom-info");
  if(!el||!gameState) return;
  const wasCleared=gameState.gameWon===true;
  const isBoom=gameState.gameOver===true;
  const nextMinesAuto=wasCleared?(gameState.mines||10)+10:isBoom?10:(gameState.mines||10);
  const nextStageAuto=wasCleared?(gameState.stageNum||1)+1:isBoom?1:(gameState.stageNum||1)+1;
  // 지뢰 입력 기본값
  const minesInput=document.getElementById("newroom-mines");
  if(minesInput&&!minesInput.value) minesInput.value=nextMinesAuto;
  el.innerHTML=
    "현재: <b>"+(gameState.stageNum||1)+"번째 방</b> | 지뢰 <b>"+(gameState.mines||10)+"개</b><br>"+
    "추천 다음 방: <b style='color:#185FA5;'>"+nextStageAuto+"번째 방 | 지뢰 "+nextMinesAuto+"개</b>"+
    (wasCleared?" 🎉 클리어":isBoom?" 💥 폭파":"");
}

// 지뢰 프리셋 버튼
document.querySelectorAll(".mines-preset").forEach(function(btn){
  btn.addEventListener("click",function(){
    const inp=document.getElementById("newroom-mines");
    if(inp) inp.value=this.dataset.mines;
  });
});

// 새 방 생성 버튼
document.getElementById("btn-make-newroom").addEventListener("click",async function(){
  const mc=parseInt((document.getElementById("newroom-mines")||{}).value)||10;
  const errEl=document.getElementById("newroom-err");
  errEl.style.display="none";
  if(mc<1||mc>300){errEl.textContent="지뢰 수는 1~300개입니다.";errEl.style.display="block";return;}
  if(!gameState||!gameState.players){errEl.textContent="게임 데이터가 없어요.";errEl.style.display="block";return;}
  this.disabled=true;this.textContent="생성 중...";
  const wasCleared=gameState.gameWon===true;
  const newStage=wasCleared?(gameState.stageNum||1)+1:(gameState.stageNum||1);
  const newCleared=(gameState.clearedRooms||0)+(wasCleared?1:0);
  const newId=Math.random().toString(36).slice(2,8).toUpperCase();
  const newPlayers=gameState.players.map(function(p){
    return {name:p.name,color:p.color,turns:p.turns,pending:false,pendingMission:"",pendingSecsVal:0,log:p.log||[]};
  });
  const ns={
    phase:"game",mines:mc,adminPwHash:gameState.adminPwHash,
    playerCount:newPlayers.length,players:newPlayers,
    stageNum:newStage,clearedRooms:newCleared,
    pendingJoin:{},board:null,
    revealed:Array(ROWS*COLS).fill(false),flagged:Array(ROWS*COLS).fill(false),
    gameOver:false,gameWon:false,firstClick:true,
    msg:"🆕 "+newStage+"번째 방 시작! 지뢰 "+mc+"개"
  };
  try{
    await set(ref(db,"rooms/"+newId),ns);
    // 기존 방에 nextRoomId 기록 → 플레이어들 자동 이동
    await update(ref(db,"rooms/"+ROOM_ID),{nextRoomId:newId});
    ROOM_ID=newId;
    gameState=ns;
    document.getElementById("room-lbl").textContent=ROOM_ID;
    localStorage.setItem("admin_session",JSON.stringify({roomId:ROOM_ID,pw:adminPw}));
    listenState();
    renderAll();
    updateStageLbl();
    document.getElementById("newroom-mines").value="";
    toast("✅ 새 방 생성 완료! 코드: "+newId);
    switchTab("players");
  }catch(e){
    errEl.textContent="오류: "+e.message;errEl.style.display="block";
  }
  this.disabled=false;this.textContent="🆕 새 방 생성";
});

// ── 토스트 ──
function toast(msg){
  const t=document.createElement("div");
  t.className="toast";t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.classList.add("show"),10);
  setTimeout(()=>{t.classList.remove("show");setTimeout(()=>t.remove(),300);},2500);
}
</script>
